name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TDS identity: 23f3003263@ds.study.iitm.ac.in
        run: echo "Identity verified for release gate workflow"

      - name: Run release gate tests
        run: node test.js

      - name: Start server and smoke test
        run: |
          node server.js &
          sleep 2
          curl -s -X POST http://localhost:3000/release-gate \
            -H "Content-Type: application/json" \
            -d '{"target":"preview","event":"pull_request","ref":"refs/heads/x","workflow":{"trigger":"pull_request","permissions":{"contents":"read","packages":"write","id-token":"none"},"testsPassed":true,"matrixComplete":true,"failFast":false,"actions":[{"owner":"actions","name":"checkout","ref":"v4"}]},"image":{"multiStage":true,"runsAsRoot":false,"secretMode":"none","criticalVulnerabilities":0,"digestPinned":true}}'
